name: ci
# Every pull request and every push to main. Each job but sandbox runs on the runner the repository
# variable RUNNER names (a JSON value: a label, or a list of labels); with no RUNNER set, for a run
# started by hand with "hosted", and for every pull request from a fork, on GitHub's own runner: a
# stranger's code never reaches a runner of the project's own. sandbox always runs on GitHub's own
# runner (it needs a fresh /proc inside bubblewrap). The required checks are eight of the jobs
# below: test, fast, slow, browser, frontend, lint, gitleaks and sandbox (install is not required
# yet). A skipped required job is never green.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosted:
        description: "run every job on GitHub's own runner, whatever RUNNER says"
        type: boolean
        default: false

# Read-only token: CI only reads the code and runs tests. No secret reaches any job.
permissions:
  contents: read

# A newer push to the same pull request cancels its older run; each push to main keeps its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# uv's cache is setup-uv's (on GitHub's runner it is saved after the job, keyed on uv.lock); a
# cache path with '..' in it makes that save fail the job. The tests run on Python 3.12, the
# version install.sh and the README install with, installed system-wide by setup-python (outside
# any home folder, as on the release machine); uv would otherwise take the image's own python3,
# whatever version it ships, or download one into the home folder.
env:
  PYTHONDONTWRITEBYTECODE: "1"
  UV_PYTHON: "3.12"
  UV_PYTHON_PREFERENCE: only-system

jobs:
  # The server's tests (tests/, without tests/page), serial.
  test:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --extra connections --extra notify
      - name: pytest (the cub sandbox tests are the sandbox job's)
        run: .venv/bin/pytest -q -rs tests

  # The page's tests, everything under 5 s (tests/page/.test_durations decides).
  fast:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The console's box tests run here too wherever bubblewrap works (and in sandbox, where it
      # is required). Their shell nests a user namespace inside the sandbox for each command,
      # which newer Ubuntu images refuse by default; this lifts that refusal as sandbox does.
      - name: nested user namespaces (GitHub's runner only)
        if: runner.environment == 'github-hosted'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          for p in /etc/apparmor.d/*bwrap* /etc/apparmor.d/*unshare*; do
            if [ -f "$p" ]; then echo "unloading $p"; sudo apparmor_parser -R "$p" || true; fi
          done
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --extra mcp
      # a test skipped because an import failed fails the run here (tests/page/conftest.py)
      - run: KRANTO_NO_IMPORT_SKIPS=1 uv run --no-sync pytest -q -rs tests/page -m "not slow" -n 4 --dist loadfile

  # The page's tests of 5 s or more.
  slow:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --extra mcp
      - run: KRANTO_NO_IMPORT_SKIPS=1 uv run --no-sync pytest -q -rs tests/page -m slow -n 4 --dist loadfile

  # The page in a real browser: every route on the fake app, no JS or HTTP error, no write.
  browser:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked --extra dev --extra mcp --group browser
      - run: python3 scripts/dev/build_ui.py
      - run: bash scripts/ci/browser.sh

  # The page's sources: type and a11y checks with warnings as errors, the component tests, the
  # build within its size budget, and the audit of the lockfile. No install scripts.
  frontend:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/kranto/page/ui/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund --prefer-offline
      - run: npm run check
      - run: npm test
      - run: python3 ../../../../../scripts/dev/build_ui.py --no-install
      # npm audit --audit-level=high, with the named, dated exceptions in npm_audit_allow.json
      - run: python3 ../../../../../scripts/ci/npm_audit.py --level high

  # Lint, the type check's ratchet, the stored-shape lint, the lock, and the public-tree scrub.
  lint:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: uv.lock matches pyproject.toml
        run: uv lock --check
      - run: uv sync --locked --extra dev --extra mcp
      - name: ruff
        run: .venv/bin/ruff check src tests scripts
      - name: the public tree (old names, private words, workflows)
        run: python3 scripts/ci/scrub.py
      - name: type check (mypy, the ratchet)
        run: .venv/bin/python scripts/ci/typecheck.py
      - name: stored-shape lint
        run: .venv/bin/python scripts/ci/stored_shape_lint.py

  # The commits this run adds: no attribution, no-reply author and committer addresses, the
  # sign-off, the scrub's words over the messages and the pull request's text; and gitleaks.
  gitleaks:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the range this run adds
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$PR_BASE..$PR_HEAD" ;;
            push) if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then range="$BEFORE..$GITHUB_SHA"; else range="$GITHUB_SHA~1..$GITHUB_SHA"; fi ;;
            *) range="HEAD~1..HEAD" ;;
          esac
          echo "range=$range" >> "$GITHUB_OUTPUT"
      - name: No tool attribution in the commits or the pull request
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci/no_attribution.py "${{ steps.range.outputs.range }}"
      - name: Commits and the pull request's text (addresses, words, sign-off)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/ci/scrub.py --commits "${{ steps.range.outputs.range }}" --dco
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          echo "scanning: $RANGE"
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$RANGE" .

  # Both sandboxes in real bubblewrap, on every pull request: the cub runtime's security test
  # plan and failure modes, and the console's box (the Claude token, credentials, the source
  # repo, push, the network and an injected README, each tested against a probe inside the
  # session). A sandbox that cannot start is a failure here, never a skip. This job always runs on
  # GitHub's own runner, whatever RUNNER says: it needs a fresh /proc inside bubblewrap, which a
  # hardened runner of your own may refuse.
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # this job keeps no cache: its dependencies are fetched fresh every run
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv sync --locked --extra dev --extra connections --extra mcp
      # GitHub's Ubuntu image has no bubblewrap, and its AppArmor forbids unprivileged user
      # namespaces by default; a runner of your own brings its own (and has no sudo). Newer
      # Ubuntu images also confine bubblewrap's children and unshare with profiles of their own,
      # which refuse the user namespace the console's shell nests inside the sandbox for each
      # command. First, on the image as it comes, the console's box must say so (the page and
      # the doctor in one line, never a sandbox it cannot have); then the restriction is lifted
      # on this throwaway machine: the sysctl alone (not enough on 26.04), the same check, then
      # the profiles unloaded, after which the box must work (what its line tells a person).
      - name: bubblewrap, and the console's box under the image's own AppArmor (GitHub's runner only)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap
          ls /etc/apparmor.d | grep -iE 'bwrap|unshare|userns' || echo "no such profile file"
          .venv/bin/pytest -q -rs -s tests/page/test_term_apparmor.py
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            .venv/bin/pytest -q -rs -s tests/page/test_term_apparmor.py -k this_machine
          fi
          for p in /etc/apparmor.d/*bwrap* /etc/apparmor.d/*unshare*; do
            if [ -f "$p" ]; then echo "unloading $p"; sudo apparmor_parser -R "$p" || true; fi
          done
          sudo aa-status 2>/dev/null | grep -iE 'bwrap|unshare|userns' || echo "no such profile loaded"
          KRANTO_EXPECT_NESTED=1 .venv/bin/pytest -q -rs -s tests/page/test_term_apparmor.py -k this_machine
      # the session's own /proc, and the user namespace kranto-shell nests in it
      - name: can bubblewrap mount a fresh /proc here?
        run: >
          bwrap --unshare-all --die-with-parent --new-session --ro-bind / / --proc /proc
          unshare --user --map-current-user --pid --fork --mount --mount-proc true
      - name: the cub runtime's security plan and failure modes
        run: >
          KRANTO_CUBS_SANDBOX_REQUIRED=1 .venv/bin/pytest -q -rs
          tests/test_cub_security.py tests/test_cub_runtime.py tests/test_cub_install.py
          tests/test_brokers.py tests/test_examples_install.py
      # A machine without a system Python 3.12 installs Kranto on one uv downloads into the home
      # folder: the plan's rows that depend on the interpreter again on such a Python (S1: no cub
      # may see the home, or a path naming it; S2-S5: what else it may reach)
      - name: the security plan on a uv-managed Python, under the home folder
        env:
          UV_PYTHON_PREFERENCE: only-managed
          UV_PROJECT_ENVIRONMENT: .venv-uv
        run: |
          uv python install 3.12
          uv sync --locked --extra dev --extra connections --extra mcp
          .venv-uv/bin/python -c 'import sys; assert sys.base_prefix.startswith("/home/"), sys.base_prefix; print(sys.base_prefix)'
          KRANTO_CUBS_SANDBOX_REQUIRED=1 .venv-uv/bin/pytest -q -rs tests/test_cub_security.py \
            -k "test_s1_ or test_s2_ or test_s3_ or test_s4_ or test_s5_"
      - name: the console's box
        run: >
          KRANTO_BWRAP_REQUIRED=1 KRANTO_TEST_REAL_CLAUDE="$(command -v claude || true)"
          .venv/bin/pytest -q -rs tests/page/test_term_sandbox.py tests/page/test_term_door.py
          tests/page/test_term_sources.py tests/page/test_print_call.py
          tests/page/test_term_apparmor.py

  # The release as a stranger installs it: the final wheel built by the release script (with a
  # pretend version), installed with uv into a scratch HOME, both commands answering it, the
  # server started on loopback ('kranto up --foreground': no systemd) and every page it serves
  # read once. Not a required check yet.
  install:
    runs-on: ${{ (inputs.hosted || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)) && 'ubuntu-latest' || fromJSON(vars.RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    env:
      VERSION: 0.0.1.dev0
      TAG: v0.0.1-dev0
      PORT: "8791"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # build.sh tags the commit it builds; on a runner of your own the checkout keeps that tag
      # from an earlier run, at another commit, and build.sh refuses it. It is only this job's.
      - name: forget the pretend tag an earlier run left here
        run: git tag -d "$TAG" 2>/dev/null || true
      - name: build the final wheel (scripts/release/build.sh)
        run: SRC="$GITHUB_WORKSPACE" DIST="$RUNNER_TEMP/dist" bash scripts/release/build.sh --shape final
      - name: install it into a scratch HOME
        run: |
          S="$RUNNER_TEMP/scratch"
          mkdir -p "$S/home"
          echo "S=$S" >> "$GITHUB_ENV"
          dist="$(python3 scripts/release/names.py dist)"
          HOME="$S/home" UV_TOOL_DIR="$S/home/tools" UV_TOOL_BIN_DIR="$S/home/bin" \
            uv tool install --python 3.12 \
            "$dist[connections,notify,mcp] @ file://$(ls "$RUNNER_TEMP/dist/$dist"-*.whl)"
      # A new install has one command. The old name is only a link that `kranto up` makes on an
      # install made before the rename (launcher.keep_old_command); the wheel never puts it here.
      - name: the command answers the version, and it is the only one
        run: |
          c="$(python3 scripts/release/names.py command)"
          got="$("$S/home/bin/$c" --version)"
          echo "$c --version: $got"
          [ "$(echo "$got" | awk '{print $2}')" = "$VERSION" ]
          ls -A "$S/home/bin"
          [ "$(ls -A "$S/home/bin")" = "$c" ]
      - name: serve on loopback, then doctor --routes
        run: |
          kr="$S/home/bin/$(python3 scripts/release/names.py command)"
          export HOME="$S/home" KRANTO_HOME="$S/home/home"
          "$kr" up --foreground --no-browser --port "$PORT" > "$S/serve.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do
            curl -sf -o /dev/null "http://127.0.0.1:$PORT/api/status" && break
            sleep 1
          done
          code=0
          "$kr" doctor --routes --port "$PORT" || code=$?
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          [ "$code" = 0 ] || { tail -n 40 "$S/serve.log"; exit 1; }
