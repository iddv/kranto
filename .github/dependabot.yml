version: 2
updates:
  # Python: pyproject.toml and uv.lock move together (CI installs with `uv sync --locked`; the
  # pip ecosystem would leave uv.lock behind). A range that already allows the new release is
  # left as it is and only the lock moves; an exact pin is raised. Minor and patch updates come
  # as one pull request a week; a major version comes on its own, to be read first.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    open-pull-requests-limit: 5
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # [build-system]'s floors say what the build needs, not the newest release; no lock
      # covers them, so each release would come as its own pull request outside the group.
      - dependency-name: hatchling
      - dependency-name: hatch-vcs
  # The page's sources (package.json and package-lock.json). CI installs with --ignore-scripts.
  # Minor and patch updates (the tool chain and the terminal library alike) come as one pull
  # request a week; a major version comes on its own, to be read first.
  - package-ecosystem: npm
    directory: /src/kranto/page/ui/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      page:
        patterns: ["*"]
        update-types: [minor, patch]
  # The workflow's actions (pinned by commit): one pull request a month for all of them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
