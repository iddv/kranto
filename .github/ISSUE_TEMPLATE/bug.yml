name: Bug
description: Something does not work as documented, or an install that broke
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **This issue is public, and tools read it. Paste no keys or tokens**, no delivery URLs and no personal data, in any field.
        A security problem goes to the Security tab (Report a vulnerability), not here.
  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `kranto --version`.
      placeholder: kranto 0.x.y
    validations:
      required: true
  - type: input
    id: distribution
    attributes:
      label: Distribution
      description: The Linux distribution and its version (`cat /etc/os-release` shows it), and whether it runs in a container or a VPS.
      placeholder: Debian 13, on a small VPS
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      description: The model that reads for you (Settings › Watching).
      options:
        - Anthropic API key
        - Claude Code login
        - OpenRouter
        - Another OpenAI-compatible endpoint
        - None yet
        - Not sure
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: What you did, one step a line, from the start. Commands exactly as you typed them.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: kranto doctor
      description: The output of `kranto doctor`. Read it before you paste it.
      render: text
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The error as the page showed it, or the file `kranto report` wrote. Keys and tokens removed.
      render: text
