# The page's tests: their own suite, with their own conftest.py (the server's tests/conftest.py is
# not loaded here). Run from the repository's root: `pytest tests/page`.
[pytest]
testpaths = .
# Random order is opt-in (`-p randomly`); by default tests run in file order.
addopts = -p no:randomly
markers =
    slow: every test measured at 5 s or more (conftest.py marks them from .test_durations); CI runs them in their own lane
    browser: the page in a real browser (Playwright); skipped where it is not installed, required in CI's browser job
    built_ui: needs the web UI built (scripts/dev/build_ui.py); skipped without a build, required in CI's browser job
