# The owner's first cub: news → a newsletter issue, sent through the
# newsletter platform the owner connected, only after the owner's approval, in practice first.
# Installed from a local folder, so trust: owner (set by Kranto). 1.1.0 (MAIL): the neutral kind
# send.newsletter and broker service newsletter; it names no platform. 1.2.0: its topics
# are picked on its Settings page (the core's topic picker), never typed as ids. 1.3.0 (STD): its
# page draws like Kranto's own: Compose its one primary, what its list says when empty, its groups'
# tones, an issue opening as a page of its text, its settings in two groups. 1.3.1: its words name
# a verb with no "…" (the owner's word). 1.4.0 (SEND): an issue whose approval an earlier
# release's kind answered (expired, practiced) leaves Waits for you; a practiced one is in its
# own group, never with the sent ones. 1.4.1 (Kranto 0.6): an issue waits until you answer it; a newer
# issue replaces it (it moves to Earlier drafts, where it can still be read).
# 1.5.0: the intro is written through Kranto's prose engine (your voice card, the
# floor, a check and a fix of only what reads like AI); newsletter.intro moved into the card.
schema: 1
api: cub/1
id: newsletter
name: local/newsletter
version: 1.5.1
bears: ">=0.5.19,<0.7"
title: Newsletter
says: Monday's issue from the week's News briefs, assembled item by item from what the briefs say, for you to read and send through your newsletter platform.
entry: main.py
requirements: null

reads: [topics, briefs]
events:
  subscribe:
    - {kind: brief.published, min_trust: first-party}      # pulled at the weekly run; no push handler
    - {kind: ticket.resolved, min_trust: core, method: on_resolved}   # the core's answer to our tickets, pushed
  publish: [newsletter.drafted]
jobs:
  - kind: newsletter.weekly
    method: compose
    every_hours: 168
    at: "08:00"
    days: [mon]
    when: newsletter.enabled
    purpose: newsletter_intro
    deadline_s: 300
    says: "Monday 08:00: composes the issue from the week's briefs; it waits for your Send"
actions:
  - kind: newsletter.compose
    title: Compose an issue
    method: compose_now
    doors: [ui, cli]
    fields:
      - {key: briefs, label: From these briefs, kind: choice, read: brief_choices, required: true}
      - {key: intro, label: Intro, kind: enum, choices: [plain, warm], required: false}
      - {key: subject, label: Subject, kind: text, required: false}
  - kind: newsletter.redraft
    title: Redraft
    method: redraft
    doors: [ui, cli]
    subjects: [newsletter_issue]
    fields:
      - {key: intro, label: Intro, kind: enum, choices: [plain, warm]}
provides: [issues, rows, count, brief_choices]
requests: [send.newsletter]
broker:
  newsletter: [emails.create_draft, emails.get, drafts.list]
http: {hosts: []}
model: {tiers: [reason], purposes: [newsletter_intro], monthly_usd: 2}
search: []
storage: own
settings:
  keys:
    newsletter.enabled: {type: bool, default: true, words: "the weekly issue"}
    newsletter.topics: {type: topics, default: [], words: "the topics an issue reads (none picked: every topic News is on for)", group: The issue}
    newsletter.intro: {type: enum, default: plain, choices: [plain, warm], words: "moved into your voice card (Kranto’ prose profile: docs/prose.md); read once", advanced: true}
    newsletter.max_items: {type: int, default: 12, lo: 3, hi: 30, words: "items an issue at most", group: The issue}
    newsletter.subject_prefix: {type: str, default: "This week", words: "the subject's first words", group: The issue}
    newsletter.send_at: {type: str, default: "now", words: "now, or a UTC time of day like 09:30: your approval schedules it then (cancel it at the platform)", group: Sending, advanced: true}
  sensitive: []
  per_topic: []
ui:
  kind: send
  glyph: mail
  primary: compose
  tile: {line: "Monday's issue from the week's briefs", count: count, words: "waits for Send", tone: wait}
  today_rows:
    - {kind: issue, read: rows, group: needs_you, primary: send.newsletter, card: issue}
  lists:
    - id: issues
      word: Issues
      read: issues
      card: issue
      groups: [{key: waiting, word: Waits for you, tone: wait}, {key: sent, word: Sent or scheduled, tone: good}, {key: practiced, word: "Practiced: not sent", tone: quiet}, {key: closed, word: Earlier drafts, tone: quiet}]
      count: waiting
      empty: "No issue yet. Monday 08:00 composes one from the week's briefs; Compose makes one now."
  forms:
    - id: compose
      word: Compose
      submit: newsletter.compose
      fields:
        - {key: briefs, label: From these briefs, kind: choice, read: brief_choices, required: true}
        - {key: intro, label: Intro, kind: enum, choices: [plain, warm]}
        - {key: subject, label: Subject, kind: text}
      cost: "about $0.01: one reason-tier call for the intro"
      says: An issue from the briefs you pick; every item is a brief's item, verbatim.
  cards:
    issue:
      title: subject
      lines: [intro]
      open: page
      body: body_markdown
      fields:
        - {key: date, label: Date, kind: date}
        - {key: briefs, label: Briefs, kind: list}
        - {key: item_count, label: Items, kind: number}
        - {key: where, label: Draft, kind: text}
        - {key: state, label: State, kind: text}
      actions: [newsletter.redraft]
      origin: cites
spend: {purposes: [newsletter_intro], caps: {}}
telemetry: {counters: {newsletter.issues: [0, 10000]}}
evals: [newsletter.tests]
grades:
  newsletter_issue: [[off_topic, off topic], [too_long, too long], [wrong_item, an item said something the brief did not]]
docs:
  page: README.md
  glossary: {Issue: "One newsletter: an intro and the week's brief items, sent through your newsletter platform after your approval."}
  words: {newsletter.enabled: "The weekly issue"}
