# bears-cub-sdk: the package a cub's author installs to write and test a cub.
# The same source as the bears_cub package inside the server's wheel (src/bears_cub/), built from
# this directory so a cub's tests can depend on it alone:
#   pip install "bears-cub-sdk @ git+https://github.com/iddv/kranto.git@v0.5.0#subdirectory=sdk"
[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bears-cub-sdk"
version = "1.4.0"
description = "Write and test a cub for kranto: the cub/1 protocol's cub side and FakeHost."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "The Kranto authors" }]
dependencies = [
  # cub.yaml is read with it, by the runner inside Kranto's sandbox and by FakeHost
  "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bears_cub"]

[tool.hatch.build.targets.wheel.force-include]
"../src/bears_cub" = "bears_cub"

[tool.hatch.build.targets.sdist.force-include]
"../src/bears_cub" = "bears_cub"
